<section>
    <h1>Login</h1>
    <form (submit)="handleLoginClick()">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" [(ngModel)]="loginModel().username" name="username" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" [(ngModel)]="loginModel().password" name="password" required>
        </div>
        <button [disabled]="progress()" type="submit">Login
            @if (progress()) {
                <div class="spinner-border text-success" role="status">
                <span class="sr-only"></span>
            </div>
            }
        </button>
    </form>
</section>
